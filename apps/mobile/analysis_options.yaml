include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    avoid_print: true
    always_declare_return_types: true
    # Deliberately not enabling require_trailing_commas: it fights with
    # `dart format`, which only adds trailing commas to calls it splits
    # across multiple lines - enabling it flags every single-line multi-arg
    # call as an issue.

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
