name: restaurant_app
description: "Customer-facing restaurant ordering app. Browse menu, order pickup/delivery, pay via Clover, track order status."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.3.0

  # Networking
  dio: ^5.7.0

  # Immutable models / codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Secure local storage for tokens (never store raw payment data here)
  flutter_secure_storage: ^9.2.2

  # Firebase (notifications, crash reporting, privacy-conscious analytics)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3

  # UI utilities
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  skeletonizer: ^1.4.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  image_path: assets/branding/logo.jpeg
  adaptive_icon_background: "#0B0B0C"
  adaptive_icon_foreground: assets/branding/logo.jpeg

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/
