name: Dependency Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly scan even without code changes, to catch newly disclosed CVEs.
    - cron: "0 6 * * 1"

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit (fails on high/critical vulnerabilities)
        run: npm audit --audit-level=high

  flutter-pub-outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check for outdated / vulnerable packages
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter pub outdated
