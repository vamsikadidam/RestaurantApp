name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: restaurant_test_password
          POSTGRES_DB: restaurant_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://restaurant:restaurant_test_password@localhost:5432/restaurant_platform_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-please-override-in-real-envs
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-please-override
      TOKEN_ENCRYPTION_KEY: ci-test-token-encryption-key-please-override
      APP_BASE_URL: http://localhost:3000
      CLOVER_ENVIRONMENT: sandbox

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared-types package
        run: npm run build --workspace=packages/shared-types

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=apps/api

      - name: Deploy migrations
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Lint
        run: npm run lint --workspace=apps/api

      - name: Unit tests
        run: npm run test --workspace=apps/api -- --coverage

      - name: E2E tests
        run: npm run test:e2e --workspace=apps/api

      - name: Build
        run: npm run build --workspace=apps/api
