name: Admin Web CI

on:
  push:
    branches: [main]
    paths:
      - "apps/admin-web/**"
      - "packages/**"
      - ".github/workflows/admin-web-ci.yml"
  pull_request:
    paths:
      - "apps/admin-web/**"
      - "packages/**"
      - ".github/workflows/admin-web-ci.yml"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=packages/api-client

      - name: Lint
        run: npm run lint --workspace=apps/admin-web

      - name: Build
        run: npm run build --workspace=apps/admin-web
